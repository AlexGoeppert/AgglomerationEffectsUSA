name: Deploy to shinyapps.io

on:
  push:
    branches:
      - main
      - codex/oct03-instruments-audit
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    container:
      image: rocker/shiny-verse:4.5.3
      
    env:
      CXXFLAGS: "-Wno-error=format-security"
      R_LIBS_USER: /tmp/agglomeration-r-library
      RENV_PATHS_ROOT: /tmp/agglomeration-renv
      RENV_CONFIG_CONSENT: "TRUE"

    steps:
      - name: Install git and git-lfs
        run: |
          apt-get update
          apt-get install -y git git-lfs

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore locked R dependencies
        # The lockfile controls both the package versions and the cache key.
        uses: actions/cache@v4
        with:
          path: |
            /tmp/agglomeration-r-library
            /tmp/agglomeration-renv
          key: r-4.5.3-linux-${{ hashFiles('renv.lock') }}

      - name: Verify locked R dependencies
        run: |
          Rscript .github/scripts/restore.R

      - name: Check app models and compare historical instruments
        env:
          APP_TEST_OUTPUT: /tmp/agglomeration-checks
        run: |
          Rscript tests/check_stock_wright.R
          Rscript tests/check_wald.R
          Rscript tests/check_anderson_rubin.R
          Rscript tests/check_data_size.R
          Rscript tests/check_instrument_options.R
          Rscript tests/check_models.R
          Rscript tests/check_state.R
          Rscript tests/compare_coefficients.R
          Rscript tests/compare_instrument_years.R

      - name: Save validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-validation
          path: /tmp/agglomeration-checks
          if-no-files-found: ignore

      - name: Create .rscignore file
        run: |
          printf '%s\n' 'tests' '.github' > .rscignore

      - name: Deploy to shinyapps.io
        if: github.ref == 'refs/heads/main'
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org"), rsconnect.max.bundle.size = 5 * 1024^3); rsconnect::setAccountInfo(name = "agoepper", token = Sys.getenv("SHINYAPPS_TOKEN"), secret = Sys.getenv("SHINYAPPS_SECRET")); rsconnect::deployApp(appName = "AgglomerationEffectsUSA", forceUpdate = TRUE)'

