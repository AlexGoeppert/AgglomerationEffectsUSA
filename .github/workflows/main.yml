name: Deploy to shinyapps.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    container:
      image: rocker/shiny-verse:4.5.3
      
    env:
      CXXFLAGS: "-Wno-error=format-security"

    steps:
      - name: Install git and git-lfs
        run: |
          apt-get update
          apt-get install -y git git-lfs

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install R Dependencies
        run: |
          R -e "install.packages(c('shiny', 'fixest', 'dplyr', 'haven', 'glue', 'stringr', 'shinycssloaders', 'DT', 'ggplot2', 'rsconnect', 'testthat', 'jsonlite'), repos = 'https://cloud.r-project.org')"

      - name: Check app models and compare historical instruments
        env:
          APP_TEST_OUTPUT: /tmp/agglomeration-checks
        run: |
          Rscript tests/check_data_size.R
          Rscript tests/check_models.R
          Rscript tests/check_state.R
          Rscript tests/compare_coefficients.R
          Rscript tests/compare_instrument_years.R

      - name: Save validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-validation
          path: /tmp/agglomeration-checks
          if-no-files-found: ignore

      - name: Create .rscignore file
        run: |
          printf '%s\n' 'renv.lock' 'tests' '.github' > .rscignore

      - name: Deploy to shinyapps.io
        run: |
          R -e "options(repos = c(CRAN = 'https://cloud.r-project.org'), rsconnect.max.bundle.size = 5 * 1024^3); rsconnect::setAccountInfo(name = 'agoepper', token = '${{ secrets.SHINYAPPS_TOKEN }}', secret = '${{ secrets.SHINYAPPS_SECRET }}'); rsconnect::deployApp(appName = 'AgglomerationEffectsUSA', forceUpdate = TRUE, dependencyResolution = 'library')"

