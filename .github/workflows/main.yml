name: Read Shiny runtime logs

on:
  workflow_dispatch:

jobs:
  runtime-logs:
    runs-on: ubuntu-latest
    container:
      image: rocker/shiny-verse:4.5.3
    env:
      R_LIBS_USER: /tmp/agglomeration-r-library
      R_LIBS_SITE: /tmp/agglomeration-r-library
      RENV_PATHS_ROOT: /tmp/agglomeration-renv
      RENV_CONFIG_CONSENT: "TRUE"
      APP_TEST_OUTPUT: /tmp/shiny-runtime-diagnostic
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git
      - name: Checkout diagnostic scripts
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /renv.lock
      - name: Restore verified R library
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/agglomeration-r-library
            /tmp/agglomeration-renv
          key: r-4.5.3-linux-${{ hashFiles('renv.lock') }}
      - name: Verify locked dependencies
        run: Rscript --vanilla .github/scripts/run-locked.R .github/scripts/restore.R
      - name: Read target app settings and runtime logs
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: Rscript --vanilla .github/scripts/run-locked.R .github/scripts/runtime-logs.R
      - name: Save diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiny-runtime-diagnostic
          path: /tmp/shiny-runtime-diagnostic
          if-no-files-found: ignore
