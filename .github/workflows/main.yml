name: Deploy to shinyapps.io

on:
  push:
    branches:
      - main  # Or your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          lfs: true # Important: This checks out LFS files
      - uses: r-lib/actions/setup-r@v2
      - name: Install dependencies
        run: |
          install.packages(c("shiny", "rsconnect", "renv"))
          renv::restore()
        shell: Rscript {0}
      - name: Deploy to shinyapps.io
        run: |
          # Set bundle size limit to 5GB
          options(rsconnect.max.bundle.size = 5 * 1024^3)
          
          # Configure account
          rsconnect::setAccountInfo(
            name = "agoepper",
            token = "${{ secrets.SHINYAPPS_TOKEN }}",
            secret = "${{ secrets.SHINYAPPS_SECRET }}"
          )
          
          # Deploy the application
          rsconnect::deployApp(
            appName = "AgglomerationEffectsUSA"
          )
        shell: Rscript {0}
