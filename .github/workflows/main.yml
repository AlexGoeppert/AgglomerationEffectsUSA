name: Deploy to shinyapps.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    container:
      image: rocker/shiny-verse:latest
      
    env:
      CXXFLAGS: "-Wno-error=format-security"

    steps:
      - name: Install git and git-lfs
        run: |
          apt-get update
          apt-get install -y git git-lfs

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install R Dependencies
        run: |
          R -e "install.packages(c('shiny', 'fixest', 'dplyr', 'haven', 'glue', 'stringr', 'shinycssloaders', 'DT', 'rsconnect'))"

      - name: Deploy to shinyapps.io
        run: |
          R -e "options(rsconnect.max.bundle.size = 5 * 1024^3); rsconnect::setAccountInfo(name = 'agoepper', token = '${{ secrets.SHINYAPPS_TOKEN }}', secret = '${{ secrets.SHINYAPPS_SECRET }}'); rsconnect::deployApp(appName = 'AgglomerationEffectsUSA')"
